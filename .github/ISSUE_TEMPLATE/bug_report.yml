name: Bug report
description: Something on the dashboard or in the data does not behave as expected
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Numbered steps, starting from opening the dashboard.
      placeholder: |
        1. Open the dashboard
        2. Press Deteriorating
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: A screenshot helps.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and operating system
