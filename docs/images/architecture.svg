<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Ward Zero system architecture"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566170"/></marker></defs><rect width="1200" height="720" rx="18" fill="#ffffff" stroke="#c9d2dc"/><text x="32" y="42" font-size="20" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Ward Zero system architecture</text><rect x="24" y="64" width="340" height="640" rx="16" fill="#fafbfc" stroke="#c9d2dc" stroke-dasharray="3 5"/><text x="42" y="90" font-size="13" font-weight="600" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Device layer (simulated)</text><rect x="384" y="64" width="436" height="640" rx="16" fill="#fafbfc" stroke="#c9d2dc" stroke-dasharray="3 5"/><text x="402" y="90" font-size="13" font-weight="600" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Platform layer (Flask + SQLite)</text><rect x="840" y="64" width="336" height="640" rx="16" fill="#fafbfc" stroke="#c9d2dc" stroke-dasharray="3 5"/><text x="858" y="90" font-size="13" font-weight="600" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Presentation layer (browser)</text><rect x="48" y="112" width="292" height="112" rx="12" fill="#eaf4f7" stroke="#17677d" stroke-width="1.5"/><text x="64" y="140" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Sensor simulator</text><text x="324" y="140" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">simulator.py</text><text x="64" y="166" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Virtual HR, SpO2, BP, temperature</text><text x="64" y="186" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Scenarios: stable, deteriorating</text><text x="64" y="206" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">One reading per second</text><rect x="48" y="300" width="292" height="112" rx="12" fill="#eaf4f7" stroke="#17677d" stroke-width="1.5"/><text x="64" y="328" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Offline buffer</text><text x="324" y="328" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">queue.json</text><text x="64" y="354" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Atomic writes, capped at 5,000</text><text x="64" y="374" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Flushed in chunks of 200</text><text x="64" y="394" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Survives restarts and power loss</text><rect x="408" y="112" width="388" height="132" rx="12" fill="#f3f5f7" stroke="#7b8794" stroke-width="1.5"/><text x="424" y="140" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">REST API</text><text x="780" y="140" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">app.py</text><text x="424" y="166" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">POST /api/readings  validate, dedupe by cid</text><text x="424" y="186" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GET /api/state  one snapshot for the UI</text><text x="424" y="206" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">POST /api/notes  /checkin  /alerts/id/ack</text><text x="424" y="226" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GET /api/health  liveness</text><rect x="408" y="290" width="180" height="118" rx="12" fill="#fff6e6" stroke="#9a5a08" stroke-width="1.5"/><text x="424" y="318" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Risk engine</text><text x="572" y="318" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">risk.py</text><text x="424" y="344" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Vital bands + trend</text><text x="424" y="364" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">+ caregiver notes</text><text x="424" y="384" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Explainable reasons</text><rect x="616" y="290" width="180" height="118" rx="12" fill="#fdeeec" stroke="#c0352b" stroke-width="1.5"/><text x="632" y="318" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Alert manager</text><text x="780" y="318" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">app.py</text><text x="632" y="344" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Raise, supersede</text><text x="632" y="364" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Acknowledge</text><text x="632" y="384" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Signal-lost alerts</text><rect x="408" y="440" width="388" height="112" rx="12" fill="#fdeeec" stroke="#c0352b" stroke-width="1.5"/><text x="424" y="468" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Supervisor thread (every 1 s)</text><text x="780" y="468" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">app.py</text><text x="424" y="494" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Escalates by the server clock, no browser needed</text><text x="424" y="514" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Logs one notification per rung (simulated)</text><text x="424" y="534" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Closes signal-lost alerts when data returns</text><rect x="408" y="584" width="388" height="100" rx="12" fill="#f3f5f7" stroke="#7b8794" stroke-width="1.5"/><text x="424" y="612" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">SQLite (WAL mode)</text><text x="780" y="612" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">wardzero.db</text><text x="424" y="638" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">readings, notes, alerts, checkins, notifications</text><text x="424" y="658" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Idempotent inserts, write lock, timeout</text><rect x="864" y="112" width="288" height="132" rx="12" fill="#eef0fb" stroke="#4b5bb0" stroke-width="1.5"/><text x="880" y="140" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Dashboard</text><text x="1136" y="140" font-size="12" font-weight="500" fill="#566170" text-anchor="end" font-family="Helvetica, Arial, sans-serif">templates/index.html</text><text x="880" y="166" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Polls /api/state every second</text><text x="880" y="186" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Sends acknowledge, notes, controls</text><text x="880" y="206" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Vitals, ECG trace, risk reasons</text><rect x="864" y="300" width="288" height="112" rx="12" fill="#e8f5ee" stroke="#1b8450" stroke-width="1.5"/><text x="880" y="328" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Caregiver</text><text x="880" y="354" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Acknowledges alerts</text><text x="880" y="374" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Checks in, adds notes (EN / HI)</text><text x="880" y="394" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Controls the demo scenario</text><line x1="340" y1="168" x2="408" y2="168" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><line x1="194" y1="300" x2="194" y2="226" stroke="#566170" stroke-width="1.75" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="101.2" y="251" width="185.6" height="20" rx="6" fill="#ffffff"/><text x="194" y="266" font-size="12" font-weight="500" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">offline: store, then flush</text><line x1="602" y1="244" x2="498" 