<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Alert escalation ladder"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566170"/></marker></defs><rect width="1200" height="410" rx="18" fill="#ffffff" stroke="#c9d2dc"/><text x="32" y="42" font-size="20" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Alert escalation ladder</text><text x="32" y="84" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Elapsed time since the first alarm (step length = ESCALATION_SECONDS, default 30 s)</text><line x1="60" y1="132" x2="1140" y2="132" stroke="#c9d2dc" stroke-width="2"/><circle cx="60" cy="132" r="9" fill="#1b8450"/><text x="60" y="112" font-size="14" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">0 s</text><rect x="24" y="160" width="280" height="96" rx="12" fill="#e8f5ee" stroke="#1b8450" stroke-width="1.5"/><text x="40" y="188" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Caregiver notified</text><text x="40" y="214" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Push notification logged;</text><text x="40" y="234" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">dashboard shows a countdown</text><circle cx="440" cy="132" r="9" fill="#9a5a08"/><text x="440" y="112" font-size="14" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">30 s</text><rect x="404" y="160" width="280" height="96" rx="12" fill="#fff6e6" stroke="#9a5a08" stroke-width="1.5"/><text x="420" y="188" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Family notified</text><text x="420" y="214" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">SMS logged (simulated);</text><text x="420" y="234" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">countdown to the next step</text><circle cx="820" cy="132" r="9" fill="#c0352b"/><text x="820" y="112" font-size="14" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">60 s</text><rect x="784" y="160" width="280" height="96" rx="12" fill="#fdeeec" stroke="#c0352b" stroke-width="1.5"/><text x="800" y="188" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Doctor notified</text><text x="800" y="214" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Voice call logged (simulated);</text><text x="800" y="234" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">stays open until acknowledged</text><rect x="60" y="290" width="340" height="96" rx="12" fill="#e8f5ee" stroke="#1b8450" stroke-width="1.5"/><text x="76" y="318" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Acknowledge</text><text x="76" y="344" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A caregiver taps Acknowledge.</text><text x="76" y="364" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The alert closes; response time is kept.</text><rect x="430" y="290" width="340" height="96" rx="12" fill="#f3f5f7" stroke="#7b8794" stroke-width="1.5"/><text x="446" y="318" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Supersede rule</text><text x="446" y="344" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A higher alert replaces a lower one,</text><text x="446" y="364" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">keeping the original alarm time.</text><rect x="800" y="290" width="340" height="96" rx="12" fill="#fff6e6" stroke="#9a5a08" stroke-width="1.5"/><text x="816" y="318" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Signal lost</text><text x="816" y="344" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">No readings for 45 s raises its own</text><text x="816" y="364" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">alert; it closes when data returns.</text></svg>