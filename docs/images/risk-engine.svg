<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 432" width="1200" height="432" role="img" aria-label="Risk engine: bands, trend, notes"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566170"/></marker></defs><rect width="1200" height="432" rx="18" fill="#ffffff" stroke="#c9d2dc"/><text x="32" y="42" font-size="20" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Risk engine: bands, trend, notes</text><rect x="28" y="72" width="372" height="300" rx="12" fill="#eaf4f7" stroke="#17677d" stroke-width="1.5"/><text x="44" y="100" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">1. Vital bands (0 to 3 points each)</text><text x="44" y="126" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">SpO2 (%): 91 or less = 3; 92-93 = 2; 94-95 = 1</text><text x="44" y="146" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Heart rate: 40 or less, 131 or more = 3;</text><text x="44" y="166" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">111-130 = 2; 41-50, 91-110 = 1</text><text x="44" y="186" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Systolic BP: 90 or less, 220 or more = 3;</text><text x="44" y="206" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">91-100 = 2; 101-110 = 1</text><text x="44" y="226" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Temperature: 35 or less = 3; 39.1 or more = 2;</text><text x="44" y="246" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">35.1-36, 38.1-39 = 1</text><text x="44" y="266" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif"></text><text x="44" y="286" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">NEWS2-inspired. Illustrative, not validated.</text><rect x="428" y="72" width="372" height="140" rx="12" fill="#fff6e6" stroke="#9a5a08" stroke-width="1.5"/><text x="444" y="100" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">2. Trend (window of 24 readings)</text><text x="444" y="126" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">SpO2 fell by 3 or more:  +2</text><text x="444" y="146" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Heart rate rose by 15 or more:  +1</text><text x="444" y="166" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Systolic BP fell by 15 or more:  +1</text><text x="444" y="186" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Temperature rose by 0.8 or more:  +1</text><rect x="428" y="232" width="372" height="140" rx="12" fill="#f3f5f7" stroke="#7b8794" stroke-width="1.5"/><text x="444" y="260" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">3. Caregiver notes (last 30 min)</text><text x="444" y="286" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">English and Hindi keyword groups:</text><text x="444" y="306" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">breathless / saans, chest pain, dizzy /</text><text x="444" y="326" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">chakkar, fever / bukhar, vomiting / ulti,</text><text x="444" y="346" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">weakness. +1 per group, at most +3</text><rect x="836" y="72" width="336" height="168" rx="12" fill="#fdeeec" stroke="#c0352b" stroke-width="1.5"/><text x="852" y="100" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Total score and level</text><text x="852" y="126" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">High    score 6 or more</text><text x="852" y="146" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Medium  score 3 to 5, or any single</text><text x="852" y="166" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">              vital scoring 3</text><text x="852" y="186" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Low     otherwise</text><text x="852" y="206" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Early warning (trend 2+) lifts Low to Medium</text><rect x="836" y="262" width="336" height="110" rx="12" fill="#e8f5ee" stroke="#1b8450" stroke-width="1.5"/><text x="852" y="290" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Output</text><text x="852" y="316" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Level + score</text><text x="852" y="336" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Reasons list, e.g. 'SpO2 88.9% (+3)'</text><text x="852" y="356" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Early-warning flag</text><text x="414" y="148" font-size="22" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">+</text><text x="614" y="228" font-size="22" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">+</text><line x1="800" y1="142" x2="836" y2="142" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><rect x="801.1" y="113" width="33.8" height="20" rx="6" fill="#ffffff"/><text x="818" y="128" font-size="12" font-weight="500" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">sum</text><line x1="800" y1="302" x2="836" y2="215" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><line x1="1004" y1="240" x2="1004" y2="262" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><text x="32" y="410" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Rules were chosen over a black-box model so every alert can state exactly why it was raised.</text></svg>