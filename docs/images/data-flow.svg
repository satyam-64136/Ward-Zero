<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="Sense, Understand, Predict, Alert, Respond"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566170"/></marker></defs><rect width="1200" height="372" rx="18" fill="#ffffff" stroke="#c9d2dc"/><text x="32" y="42" font-size="20" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Sense, Understand, Predict, Alert, Respond</text><rect x="28" y="84" width="204" height="150" rx="12" fill="#eaf4f7" stroke="#17677d" stroke-width="1.5"/><text x="44" y="112" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Sense</text><text x="44" y="138" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Simulator emits one</text><text x="44" y="158" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">reading per second:</text><text x="44" y="178" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">hr, spo2, sbp, dbp, temp</text><rect x="28" y="250" width="204" height="44" rx="10" fill="#fff" stroke="#c9d2dc"/><text x="130" y="277" font-size="13" font-weight="600" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">reading</text><line x1="130" y1="234" x2="130" y2="250" stroke="#566170" stroke-width="1.75" marker-end="url(#a)"/><line x1="232" y1="159" x2="260" y2="159" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><rect x="260" y="84" width="204" height="150" rx="12" fill="#f3f5f7" stroke="#7b8794" stroke-width="1.5"/><text x="276" y="112" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Understand</text><text x="276" y="138" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Validate and store the</text><text x="276" y="158" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">reading, then score the</text><text x="276" y="178" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">four vitals against bands</text><rect x="260" y="250" width="204" height="44" rx="10" fill="#fff" stroke="#c9d2dc"/><text x="362" y="277" font-size="13" font-weight="600" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">score + reasons</text><line x1="362" y1="234" x2="362" y2="250" stroke="#566170" stroke-width="1.75" marker-end="url(#a)"/><line x1="464" y1="159" x2="492" y2="159" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><rect x="492" y="84" width="204" height="150" rx="12" fill="#fff6e6" stroke="#9a5a08" stroke-width="1.5"/><text x="508" y="112" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Predict</text><text x="508" y="138" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Compare the first and last</text><text x="508" y="158" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">6 readings of a 24-reading</text><text x="508" y="178" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">window for a worsening trend</text><rect x="492" y="250" width="204" height="44" rx="10" fill="#fff" stroke="#c9d2dc"/><text x="594" y="277" font-size="13" font-weight="600" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">early-warning flag</text><line x1="594" y1="234" x2="594" y2="250" stroke="#566170" stroke-width="1.75" marker-end="url(#a)"/><line x1="696" y1="159" x2="724" y2="159" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><rect x="724" y="84" width="204" height="150" rx="12" fill="#fdeeec" stroke="#c0352b" stroke-width="1.5"/><text x="740" y="112" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Alert</text><text x="740" y="138" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Medium or High raises one</text><text x="740" y="158" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">alert. A higher level</text><text x="740" y="178" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">supersedes an open one</text><rect x="724" y="250" width="204" height="44" rx="10" fill="#fff" stroke="#c9d2dc"/><text x="826" y="277" font-size="13" font-weight="600" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">alert record</text><line x1="826" y1="234" x2="826" y2="250" stroke="#566170" stroke-width="1.75" marker-end="url(#a)"/><line x1="928" y1="159" x2="956" y2="159" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><rect x="956" y="84" width="204" height="150" rx="12" fill="#e8f5ee" stroke="#1b8450" stroke-width="1.5"/><text x="972" y="112" font-size="16" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Respond</text><text x="972" y="138" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Caregiver, then family, then</text><text x="972" y="158" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">doctor on a timer. An</text><text x="972" y="178" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">acknowledgement closes it</text><rect x="956" y="250" width="204" height="44" rx="10" fill="#fff" stroke="#c9d2dc"/><text x="1058" y="277" font-size="13" font-weight="600" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">ack + response time</text><line x1="1058" y1="234" x2="1058" y2="250" stroke="#566170" stroke-width="1.75" marker-end="url(#a)"/><line x1="1066" y1="316" x2="366" y2="316" stroke="#566170" stroke-width="1.75" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="544.0" y="305" width="344.0" height="20" rx="6" fill="#ffffff"/><text x="716" y="320" font-size="12" font-weight="500" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">acknowledgement stops escalation; closes the alert</text><text x="32" y="350" font-size="13" font-weight="400" fill="#566170" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Every stage is visible live in the dashboard's pipeline strip.</text></svg>