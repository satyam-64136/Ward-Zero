<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Offline buffering and recovery"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566170"/></marker></defs><rect width="1200" height="560" rx="18" fill="#ffffff" stroke="#c9d2dc"/><text x="32" y="42" font-size="20" font-weight="700" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Offline buffering and recovery</text><rect x="20" y="64" width="260" height="40" rx="10" fill="#f3f5f7" stroke="#7b8794"/><text x="150" y="89" font-size="14" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Simulator</text><line x1="150" y1="104" x2="150" y2="530" stroke="#c9d2dc" stroke-dasharray="4 5"/><rect x="470" y="64" width="260" height="40" rx="10" fill="#f3f5f7" stroke="#7b8794"/><text x="600" y="89" font-size="14" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Disk buffer (queue.json)</text><line x1="600" y1="104" x2="600" y2="530" stroke="#c9d2dc" stroke-dasharray="4 5"/><rect x="910" y="64" width="260" height="40" rx="10" fill="#f3f5f7" stroke="#7b8794"/><text x="1040" y="89" font-size="14" font-weight="700" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">API + database</text><line x1="1040" y1="104" x2="1040" y2="530" stroke="#c9d2dc" stroke-dasharray="4 5"/><circle cx="60" cy="136" r="13" fill="#0e141b"/><text x="60" y="141" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><line x1="150" y1="136" x2="1040" y2="136" stroke="#0e141b" stroke-width="1.75" marker-end="url(#a)"/><rect x="528.6" y="109" width="132.8" height="20" rx="6" fill="#ffffff"/><text x="595.0" y="124" font-size="12" font-weight="500" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">POST /api/readings</text><text x="595.0" y="158" font-size="13" font-weight="500" fill="#566170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Online: send each reading</text><circle cx="60" cy="196" r="13" fill="#0e141b"/><text x="60" y="201" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><line x1="150" y1="196" x2="600" y2="196" stroke="#c0352b" stroke-width="1.75" marker-end="url(#a)"/><rect x="328.4" y="169" width="93.19999999999999" height="20" rx="6" fill="#ffffff"/><text x="375.0" y="184" font-size="12" font-weight="500" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">atomic write</text><text x="375.0" y="218" font-size="13" font-weight="500" fill="#566170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Network cut: append to buffer</text><circle cx="60" cy="256" r="13" fill="#0e141b"/><text x="60" y="261" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="90" y="261" font-size="13" font-weight="500" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Dashboard shows 'No signal, buffering'</text><circle cx="60" cy="316" r="13" fill="#0e141b"/><text x="60" y="321" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><line x1="600" y1="316" x2="1040" y2="316" stroke="#1b8450" stroke-width="1.75" marker-end="url(#a)"/><rect x="773.4" y="289" width="93.19999999999999" height="20" rx="6" fill="#ffffff"/><text x="820.0" y="304" font-size="12" font-weight="500" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">chunked POST</text><text x="820.0" y="338" font-size="13" font-weight="500" fill="#566170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Restored: flush oldest first, 200 at a time</text><circle cx="60" cy="376" r="13" fill="#0e141b"/><text x="60" y="381" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text><text x="90" y="381" font-size="13" font-weight="500" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Validate, dedupe by cid, re-score by timestamp</text><circle cx="60" cy="436" r="13" fill="#0e141b"/><text x="60" y="441" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">6</text><line x1="1040" y1="436" x2="600" y2="436" stroke="#1b8450" stroke-width="1.75" marker-end="url(#a)"/><rect x="806.4" y="409" width="27.2" height="20" rx="6" fill="#ffffff"/><text x="820.0" y="424" font-size="12" font-weight="500" fill="#0e141b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">ok</text><text x="820.0" y="458" font-size="13" font-weight="500" fill="#566170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Buffer clears only after a 200 response</text><circle cx="60" cy="496" r="13" fill="#0e141b"/><text x="60" y="501" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">7</text><text x="90" y="501" font-size="13" font-weight="500" fill="#0e141b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Silent for 45 s (any cause): signal-lost alert; it closes when data returns</text></svg>