[project]
name = "ward-zero"
version = "0.3.0"
description = "Simulated home-care ward: vitals, explainable risk, alerts, escalation and caregiver response"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["flask>=3.0", "requests>=2.31"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E701", "E702", "E731"]  # compact one-line statements are used deliberately in tests/scripts
